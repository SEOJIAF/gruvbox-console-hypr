config_version = 13

[bar.default]
end = [ "tray", "notifications", "clipboard", "volume", "brightness", "battery", "control-center" ]
margin_ends = 0
radius = 0
start = [ "workspaces" ]

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 640.0
    cy = 538.0
    output = "eDP-1"
    placement_height = 720.0
    placement_width = 1280.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
corner_radius_scale = 0.0
popup_shadows = false

[theme]
builtin = "Gruvbox"
community_palette = "Oxocarbon"
source = "builtin"
wallpaper_scheme = "m3-content"

[wallpaper.default]
path = "HOME_DIR/.local/share/backgrounds/6174484.png"

[wallpaper.last]
path = "HOME_DIR/.local/share/backgrounds/6174484.png"

[wallpaper.monitors.eDP-1]
path = "HOME_DIR/.local/share/backgrounds/6174484.png"