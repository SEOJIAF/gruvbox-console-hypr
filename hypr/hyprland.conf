# Minimal Phase 1 baseline — boots to a blank session with a terminal
# keybind. Colors/fonts/noctalia land in later phases.

# Fractional monitor scale (1.5 on this panel). Toolkit chrome in native-Wayland
# Electron/Chromium/Firefox rounds 1.5 up to 2 and looks oversized, so those run
# on XWayland instead, which force_zero_scaling lets Hyprland upscale correctly.
monitor=,preferred,auto,auto

env = XCURSOR_SIZE,24
env = MOZ_ENABLE_WAYLAND,0
# Electron/Chromium apps (VSCodium, etc.) default to native Wayland and hit the
# same fractional-scale rounding bug; push them to XWayland as well.
env = ELECTRON_OZONE_PLATFORM_HINT,x11

xwayland {
    force_zero_scaling = true
}

exec-once = qs -c noctalia-shell

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    col.active_border = rgb(fabd2f)
    col.inactive_border = rgb(504945)
    layout = dwindle
}

decoration {
    rounding = 0
}

animations {
    enabled = false
}

dwindle {
    preserve_split = true
}

# Noctalia launcher
bind = SUPER, R, exec, qs ipc -c noctalia-shell call launcher toggle

# Terminal
bind = SUPER, Return, exec, kitty

# Session
bind = SUPER SHIFT, E, exit,
bind = SUPER, Q, killactive,

# Workspaces (1-9, 0 = 10)
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Focus movement
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
